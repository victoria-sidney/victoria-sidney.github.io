<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ВІТА | Співачка Нової Ери</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
        
        /* Головний екран */
        .hero { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: url('ц.jpg') no-repeat center top/cover; 
        }
        .text-box { background: rgba(0,0,0,0.4); padding: 40px; border: 2px solid #fff; }
        h1 { font-size: 7rem; margin: 0; letter-spacing: 20px; text-transform: uppercase; }
        p { font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; margin-top: 10px; }
        
        /* Секція з фото (початкова структура) */
        .section { padding: 100px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="text-box">
            <h1>ВІТА</h1>
            <p>Співачка Нової Ери</p>
        </div>
    </div>
    
    <div class="section">
        <h2>Фото-Всесвіт</h2>
        <div class="grid">
            <img src="Whisk_0a2d93a942c31f6915f4df5dd574cc4bdr.png" alt="Віта">
            <img src="2 (11).jpg" alt="Віта">
        </div>
    </div>
</body>
</html>
