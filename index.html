<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ВІТА | Співачка Нової Ери</title>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: center; }
    
    .hero { 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        background: url('ц.jpg') no-repeat center top/cover; 
        text-shadow: 3px 3px 10px rgba(0,0,0,0.8); /* додаємо тінь для об'єму */
    }
    
    h1 { 
        font-size: 5rem; 
        letter-spacing: 8px; 
        text-transform: uppercase; 
        margin: 0; 
        font-weight: 800; /* робимо шрифт жирнішим */
    }
    
    p { 
        font-size: 1.5rem; 
        letter-spacing: 3px; 
        opacity: 0.9; 
        margin-top: 10px;
    }

    .section { padding: 80px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
    img { width: 100%; height: auto; border-radius: 8px; transition: transform 0.3s; }
    img:hover { transform: scale(1.03); }
</style>
</head>
<body>
    <div class="hero">
        <h1>ВІТА</h1>
        <p>Співачка Нової Ери</p>
    </div>
    
    <div class="section">
        <h2>Фото-Всесвіт</h2>
        <div class="grid">
            <img src="Whisk_0a2d93a942c31f6915f4df5dd574cc4bdr.png" alt="Віта">
            <img src="2 (11).jpg" alt="Віта">
        </div>
    </div>
</body>
</html>
