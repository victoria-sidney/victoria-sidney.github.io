<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ВІТА | Співачка Нової Ери</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; }
        .hero { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: url('ц.jpg') no-repeat center top/cover; 
        }
        /* Стиль плашки як на твоєму скріні */
        .text-overlay { 
            background: rgba(0,0,0,0.6); 
            padding: 20px 40px; 
            display: inline-block;
        }
        h1 { font-size: 5rem; margin: 0; letter-spacing: 15px; text-transform: uppercase; font-weight: bold; }
        p { font-size: 1.2rem; letter-spacing: 8px; text-transform: uppercase; margin-top: 10px; opacity: 0.9; }
        
        .section { padding: 50px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 40px; max-width: 1200px; margin: auto; }
        img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="text-overlay">
            <h1>ВІТА</h1>
            <p>Співачка Нової Ери</p>
        </div>
    </div>
    
    <div class="section">
        <h2 style="font-size: 2rem; margin-bottom: 40px;">Фото-Всесвіт</h2>
        <div class="grid">
            <img src="Whisk_0a2d93a942c31f6915f4df5dd574cc4bdr.png" alt="Фото 1">
            <img src="Ванільні Мости.jpg" alt="Фото 2">
        </div>
    </div>
</body>
</html>
